name: DAST - OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Start HTTP server
        run: |
          npx --yes http-server@14.1.1 dist/azure-quiz-frontend/browser -p 4200 --silent > app-dast.log 2>&1 &

          echo "Waiting for HTTP server to become ready..."
          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:4200/ > /dev/null; then
              echo "HTTP server is ready on port 4200."
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application failed to start within timeout. Application logs:"
            cat app-dast.log
            exit 1
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:4200'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Generate job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## DAST Scan Summary (OWASP ZAP)"
            echo ""
            echo "> This informative scan targets the static Angular build served by http-server, not the production Nginx container. Missing HTTP security headers may therefore be expected here."
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo '| **Target scanned** | `http://localhost:4200` |'
            echo "| **Scan type** | Baseline (passive) |"
            echo "| **Blocking status** | No (informative only) |"

            if jq -e '.site' report_json.json > /dev/null 2>&1; then
              high=$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' report_json.json)
              medium=$(jq '[.site[]?.alerts[]? | select(.riskcode == "2")] | length' report_json.json)
              low=$(jq '[.site[]?.alerts[]? | select(.riskcode == "1")] | length' report_json.json)
              info=$(jq '[.site[]?.alerts[]? | select(.riskcode == "0")] | length' report_json.json)
              echo "| **High alerts** | $high |"
              echo "| **Medium alerts** | $medium |"
              echo "| **Low alerts** | $low |"
              echo "| **Informational alerts** | $info |"
            else
              echo "| **Alerts** | Report unavailable or invalid |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if jq -e '.site' report_json.json > /dev/null 2>&1; then
            {
              echo ""
              echo "<details><summary>Medium and high alert details</summary>"
              echo ""
              echo "| Risk | Rule | Occurrences | Example URLs |"
              echo "|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"

            rows=$(jq -r '
              [.site[]?.alerts[]? | select(.riskcode == "2" or .riskcode == "3")]
              | .[]
              | "| " + .riskdesc + " | " + (.alert | gsub("\\|"; "\\|")) + " | " + ((.count // (.instances | length)) | tostring) + " | " + ([.instances[]?.uri] | .[0:2] | join("<br>")) + " |"
            ' report_json.json)
            if [ -n "$rows" ]; then
              printf '%s\n' "$rows" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| - | No medium or high alerts | 0 | - |" >> "$GITHUB_STEP_SUMMARY"
            fi

            {
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -s report_md.md ]; then
            {
              echo ""
              echo "<details><summary>Full ZAP report</summary>"
              echo ""
              cat report_md.md
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
