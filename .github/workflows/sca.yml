name: SCA - Software Composition Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dependency-review:
    name: PR Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  trivy-sca:
    name: Full Dependency Scan (npm & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run npm audit
        # First security layer via npm advisories
        run: npm audit --audit-level=high
        # Continue on error to allow Trivy to generate its report
        continue-on-error: true

      - name: Run Trivy SCA Scan
        id: trivy_scan
        # Scans package-lock.json directly without requiring npm ci
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          output: 'trivy-sca-report.txt'
          format: 'table'
          exit-code: '1'
        continue-on-error: true

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 📦 SCA Scan Summary (Dependencies)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -s trivy-sca-report.txt ]; then
            echo "### ⚠️ Vulnerabilities Detected in Dependencies" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-sca-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🟢 **No HIGH or CRITICAL vulnerabilities found in npm dependencies.**" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Scan performed on repository dependencies (package-lock.json)." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce scan result
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "Trivy detected HIGH or CRITICAL vulnerabilities in dependencies. Failing the job."
          exit 1