name: Helm CI/CD for AppBAQ Frontend

on:
  push:
    branches: [main]
    paths:
      - helm/appbaq-frontend/**
      - .github/workflows/helm.yml
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run on AKS"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy

permissions:
  contents: read
  id-token: write

env:
  CHART_PATH: helm/appbaq-frontend
  RELEASE_NAME: appbaq-frontend
  NAMESPACE: appbaq-then

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint ${{ env.CHART_PATH }} --strict

      - name: Render manifests
        run: helm template test ${{ env.CHART_PATH }} > /dev/null

  deploy-aks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy') }}
    needs: lint-and-validate
    environment: aks-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AKS cluster (query)
        id: aks
        env:
          AKS_TAG_COHORT: ${{ secrets.AKS_TAG_COHORT }}
          AKS_TAG_SCOPE: ${{ secrets.AKS_TAG_SCOPE }}
        run: |
          if [ -z "$AKS_TAG_COHORT" ] || [ -z "$AKS_TAG_SCOPE" ]; then
            echo "Missing AKS_TAG_COHORT or AKS_TAG_SCOPE secret" >&2
            exit 1
          fi

          AKS_COUNT=$(az aks list \
            --query "length([?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'])" -o tsv)

          if [ "$AKS_COUNT" -eq 0 ]; then
            echo "No AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            exit 1
          fi

          if [ "$AKS_COUNT" -gt 1 ]; then
            echo "Multiple AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            echo "Refine AKS tags so they match exactly one cluster." >&2
            exit 1
          fi

          AKS_NAME=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].name" -o tsv)
          AKS_RESOURCE_GROUP=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].resourceGroup" -o tsv)

          if [ -z "$AKS_NAME" ] || [ -z "$AKS_RESOURCE_GROUP" ]; then
            echo "Unable to resolve AKS name or resource group" >&2
            exit 1
          fi

          echo "name=$AKS_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AKS_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --name "${{ steps.aks.outputs.name }}" \
            --admin \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Deploy chart
        run: |
          helm upgrade --install "${{ env.RELEASE_NAME }}" "${{ env.CHART_PATH }}" \
            --namespace "${{ env.NAMESPACE }}" \
            --create-namespace

      - name: Show frontend URL
        run: |
          SERVICE_NAME="appbaq-frontend"
          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          echo "Waiting for external endpoint on service $SERVICE_NAME in namespace ${{ env.NAMESPACE }}..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            EXTERNAL_IP=$(kubectl get svc "$SERVICE_NAME" -n "${{ env.NAMESPACE }}" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            EXTERNAL_HOSTNAME=$(kubectl get svc "$SERVICE_NAME" -n "${{ env.NAMESPACE }}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "$EXTERNAL_IP" ]; then
              URL="http://$EXTERNAL_IP"
              echo "Frontend URL: $URL"
              echo "frontend_url=$URL" >> "$GITHUB_OUTPUT"
              echo "Frontend URL: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ -n "$EXTERNAL_HOSTNAME" ]; then
              URL="http://$EXTERNAL_HOSTNAME"
              echo "Frontend URL: $URL"
              echo "frontend_url=$URL" >> "$GITHUB_OUTPUT"
              echo "Frontend URL: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Attempt $i/$MAX_ATTEMPTS: endpoint not assigned yet."
            sleep $SLEEP_SECONDS
          done

          echo "No external endpoint assigned yet. Check with: kubectl get svc $SERVICE_NAME -n ${{ env.NAMESPACE }}"

  destroy-aks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    needs: lint-and-validate
    environment: aks-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AKS cluster (query)
        id: aks
        env:
          AKS_TAG_COHORT: ${{ secrets.AKS_TAG_COHORT }}
          AKS_TAG_SCOPE: ${{ secrets.AKS_TAG_SCOPE }}
        run: |
          if [ -z "$AKS_TAG_COHORT" ] || [ -z "$AKS_TAG_SCOPE" ]; then
            echo "Missing AKS_TAG_COHORT or AKS_TAG_SCOPE secret" >&2
            exit 1
          fi

          AKS_COUNT=$(az aks list \
            --query "length([?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'])" -o tsv)

          if [ "$AKS_COUNT" -eq 0 ]; then
            echo "No AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            exit 1
          fi

          if [ "$AKS_COUNT" -gt 1 ]; then
            echo "Multiple AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            echo "Refine AKS tags so they match exactly one cluster." >&2
            exit 1
          fi

          AKS_NAME=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].name" -o tsv)
          AKS_RESOURCE_GROUP=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].resourceGroup" -o tsv)

          if [ -z "$AKS_NAME" ] || [ -z "$AKS_RESOURCE_GROUP" ]; then
            echo "Unable to resolve AKS name or resource group" >&2
            exit 1
          fi

          echo "name=$AKS_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AKS_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --name "${{ steps.aks.outputs.name }}" \
            --admin \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Destroy release
        run: |
          helm uninstall "${{ env.RELEASE_NAME }}" --namespace "${{ env.NAMESPACE }}"