apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appbaq-frontend.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
{{ include "appbaq-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "appbaq-frontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
{{ toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
