{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-ingress-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "appbaq-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.allowPublicIngressPort }}
---
{{- if .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "appbaq-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
{{- if .Values.networkPolicy.egress.allowBackend }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: appbaq-backend
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backendLink.servicePort }}
{{- end }}
{{- if .Values.networkPolicy.egress.allowDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
{{- end }}
