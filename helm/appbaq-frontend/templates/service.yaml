apiVersion: v1
kind: Service
metadata:
  name: {{ include "appbaq-frontend.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
{{ include "appbaq-frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
